name: release

on:
  push:
    branches:
      - trunk

jobs:
  release:
    name: release
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.6
      - name: setup node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 'lts/*'
      - name: upgrade npm
        run: npm install -g npm
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
          version: latest
      - name: test
        run: pnpm run test
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        name: release
        run: pnpm exec semantic-release
